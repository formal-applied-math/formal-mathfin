version: v0.4
project:
  name: The fundamental theorems of asset pricing in discrete time, one risky asset
  description: "The fundamental theorems of asset pricing in discrete time for one risky asset, formalized in Lean 4 on Mathlib. The first registered theorem is the one-asset case of the Dalang–Morton–Willinger theorem: on an arbitrary filtered probability space and a finite horizon, an adapted real price process admits no arbitrage (no bounded predictable strategy has an almost surely nonnegative gain that is not almost surely zero) if and only if some probability measure equivalent to the reference measure makes the price, stopped at the horizon, a martingale. No integrability of the price, finiteness of the space or measurable-selection hypothesis is assumed. The proof replaces the measure by an equivalent one under which the price is integrable, finds in each period a conditional weight in (0, 1] that balances the price increment, applies the weights backward and normalises the total mass once, at the end. The second registered theorem is the second fundamental theorem on a finite space: when the reference measure gives every state positive mass, every event is observable at the horizon and there is no arbitrage, every bounded claim is replicable if and only if the equivalent martingale measure is unique. The several-asset Dalang–Morton–Willinger theorem is not claimed. The development sits in formal-mathfin, a library of formally verified mathematical finance built on Mathlib and Rémy Degenne's BrownianMotion package."
  authors:
    - Raphael Coelho
  license: Apache-2.0
  responsible_maintainers:
    - Raphael Coelho
