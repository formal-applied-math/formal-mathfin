version: v0.4
project:
  name: The martingale representation theorem for Brownian motion
  description: "The martingale representation theorem for one-dimensional Brownian motion, in terminal form, formalized in Lean 4 on Mathlib. The Itô integral is not taken as a primitive: it is characterized as a continuous linear map from the predictable square-integrable integrands on the horizon (0, T] to the square-integrable random variables, sending the indicator of each predictable rectangle (s, t] x F, with F observable at time s, to the increment B_t - B_s on F. The first registered theorem shows that exactly one such map exists, so the later statements are about the Itô integral itself; the second is the Itô isometry. The third is the representation theorem: for a process with the finite-dimensional laws of Brownian motion, measurable coordinates and continuous paths, every square-integrable random variable that is measurable for the natural filtration at the horizon, up to a null set, is almost surely its mean plus the Itô integral of an integrand, and that integrand is unique up to a null predictable set. The process form of the theorem and the local-martingale form are not claimed in the registered statements. The proof identifies the range of the Itô isometry by the totality of step-integrand Doléans exponentials in the square-integrable variables of the Brownian filtration. The development sits in formal-mathfin, a library of formally verified mathematical finance built on Mathlib and Rémy Degenne's BrownianMotion package."
  authors:
    - Raphael Coelho
  license: Apache-2.0
  responsible_maintainers:
    - Raphael Coelho
