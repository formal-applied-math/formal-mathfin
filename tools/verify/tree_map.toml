# The map the program tree is drawn on (tree.html; program_tree.tree_data reads this file).
#
# This is a way of *drawing* the library, not a rule about it: nothing else reads it, and a node
# it does not name is placed by its directory (`AREA_PLACE` in program_tree.py). The edges the
# page draws are still proofs (a node's `uses`, from the export); the map only decides where each
# node sits, so an edge that crosses the map — a pricing formula resting on Φ rather than on the
# pricing measure — shows where the proofs and the concepts part ways.
#
# The picture: four roots in the soil (the probability and analysis the field is built from;
# Brownian calculus under the trunk, Gaussian analysis beside it, nearest the risk and the formulas),
# one trunk (the market and its pricing functional: no-arbitrage, martingale measures, numéraires,
# contracts and their value), and five limbs (pricing models and the products priced in them;
# choice and equilibrium; risk; insurance; microstructure and DeFi). Within a limb a node sits in a
# branch; height within a part is its depth counting only uses inside that part.
#
# Format: [[part]] lists the parts in drawing order (roots left to right, then the trunk, then the
# limbs left to right), each with its branches in order. [place] puts a node in "part" or
# "part/branch".

[[part]]
key = "discrete"
kind = "root"
title = "Discrete time"
blurb = "martingale transforms, path measures, optimal stopping"

[[part]]
key = "analysis"
kind = "root"
title = "Gaussian analysis"
blurb = "Φ and quantiles, the heat kernel, the Esscher tilt"

[[part]]
key = "brownian"
kind = "root"
title = "Brownian calculus"
blurb = "the Itô integral and formula, Girsanov, representation, SDEs"

[[part]]
key = "jumps"
kind = "root"
title = "Jumps"
blurb = "Poisson and compound Poisson, Itô–Lévy"

[[part]]
key = "pricing"
kind = "trunk"
title = "The pricing functional"
blurb = "no-arbitrage, martingale measures, numéraires, contracts and their value"

[[part]]
key = "insurance"
kind = "limb"
title = "Insurance"
branches = ["survival", "ruin", "credibility"]

[[part]]
key = "risk"
kind = "limb"
title = "Risk"
branches = ["statistics", "measures", "portfolio", "dependence"]

[[part]]
key = "choice"
kind = "limb"
title = "Choice and equilibrium"
branches = ["performance", "static", "equilibrium", "dynamic"]

[[part]]
key = "models"
kind = "limb"
title = "Pricing models"
branches = ["model-free", "discrete", "black-scholes", "local-vol", "stoch-vol", "jumps",
            "fx-futures", "rates", "credit"]

[[part]]
key = "markets"
kind = "limb"
title = "Markets and DeFi"
branches = ["price-formation", "execution", "amm"]

[branch]
# display names, where the key is not enough
"black-scholes" = "Black–Scholes"
