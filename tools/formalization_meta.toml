acknowledgements = "Built on Mathlib and Rémy Degenne's BrownianMotion package."

# Further Palomar entries (docs/palomar.md), one folder each. `tools/formalization_yaml.py` writes
# `<dir>/formalization.yaml`: the repository's document above, with the entry's own `name` (the
# public entry title), `description` (the public abstract), classification, sources and main
# results. The root files above are the ADEH entry.
[[entries]]
dir = "Palomar/FTAP"
name = "The fundamental theorems of asset pricing in discrete time, one risky asset"
description = """\
The fundamental theorems of asset pricing in discrete time for one risky asset, formalized in \
Lean 4 on Mathlib. The first registered theorem is the one-asset case of the \
Dalang–Morton–Willinger theorem: on an arbitrary filtered probability space and a finite horizon, \
an adapted real price process admits no arbitrage (no bounded predictable strategy has an almost \
surely nonnegative gain that is not almost surely zero) if and only if some probability measure \
equivalent to the reference measure makes the price, stopped at the horizon, a martingale. No \
integrability of the price, finiteness of the space or measurable-selection hypothesis is \
assumed. The proof replaces the measure by an equivalent one under which the price is integrable, \
finds in each period a conditional weight in (0, 1] that balances the price increment, applies \
the weights backward and normalises the total mass once, at the end. The second registered \
theorem is the second fundamental theorem on a finite space: when every state has positive \
probability, every event is observable at the horizon and there is no arbitrage, every bounded \
claim is replicable if and only if the equivalent martingale measure is unique. The several-asset \
Dalang–Morton–Willinger theorem is not claimed. The development sits in formal-mathfin, a library \
of formally verified mathematical finance built on Mathlib and Rémy Degenne's BrownianMotion \
package."""

[entries.classification]
arxiv = ["q-fin.MF", "math.PR"]
msc2020 = ["91G20", "91G30", "60G42"]

[[entries.sources]]
id = "dalang-morton-willinger-1990"
title = "Equivalent martingale measures and no-arbitrage in stochastic securities market models"
authors = ["Robert C. Dalang", "Andrew Morton", "Walter Willinger"]
type = "article"
location = "Stochastics and Stochastic Reports 29 (1990) 185-201; doi:10.1080/17442509008833613"
relationship = "formalizes"
license = "unknown"
author_endorsement = "not-contacted"
note = "The first registered theorem is the case of one risky asset of this paper's theorem, on a general filtered probability space and a finite horizon, with arbitrage tested by bounded predictable strategies. The several-asset case is not claimed."

[[entries.sources]]
id = "harrison-pliska-1981"
title = "Martingales and stochastic integrals in the theory of continuous trading"
authors = ["J. Michael Harrison", "Stanley R. Pliska"]
type = "article"
location = "Stochastic Processes and their Applications 11 (1981) 215-260; doi:10.1016/0304-4149(81)90026-0"
relationship = "formalizes"
license = "unknown"
author_endorsement = "not-contacted"
note = "The second registered theorem is the finite-space second fundamental theorem of this paper: under no arbitrage, completeness is equivalent to uniqueness of the equivalent martingale measure. Stated for one risky asset."

[[entries.sources]]
id = "follmer-schied-stochastic-finance"
title = "Stochastic Finance: An Introduction in Discrete Time"
authors = ["Hans Föllmer", "Alexander Schied"]
type = "book"
location = "De Gruyter, Chapter 5"
relationship = "adapts"
license = "unknown"
author_endorsement = "not-contacted"
note = "The proofs follow this book's one-asset argument for the first theorem and its proof of the second, with one change in the first: the one-period weights are left unnormalised and the total mass is normalised once, at the end, since a conditional one-period density of mean one can fail to exist."

[[entries.main_results]]
declaration = "MathFin.OneAsset.noArbitrage_iff_exists_isEMM"
file = "MathFin/Pricing/FTAP/OneAssetDMW.lean"
literature = "Dalang-Morton-Willinger theorem, one risky asset (Dalang, Morton and Willinger 1990)"
source = "dalang-morton-willinger-1990"

[[entries.main_results]]
declaration = "MathFin.ftap_two"
file = "MathFin/Pricing/FTAP/FTAPComplete.lean"
literature = "Second fundamental theorem of asset pricing on a finite space (Harrison and Pliska 1981)"
source = "harrison-pliska-1981"
