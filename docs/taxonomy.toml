# How the library organizes financial mathematics: the one statement every projection reads.
# The design and its reasons: docs/specs/2026-11-08-organization-design.md; the readable account:
# docs/organization.md.
#
# Two axes. A cell answers WHERE a result sits: a root (the tools), the trunk (positions, markets,
# strategies), or one of three limbs, each a question asked of a position (valuation: what is it
# worth; choice: whether to hold it; risk: how dangerous it is), and a branch inside it. A family
# answers WHICH RANDOMNESS it is about (Gaussian diffusions, default, mortality and claims, …);
# one family serves several questions, so it is a second axis, not a place.
#
# [[cell]]   key        "part" or "part/branch"; the parts are the roots, the trunk and the limbs
#            kind       root | trunk | limb (on the part's first cell; its branches inherit it)
#            title      a name a financial mathematician would use
#            blurb      one line: what the cell asks or provides
#            modules    module-name prefixes; a module belongs to the cell of its LONGEST prefix
#            subjects   JEL / MSC codes (docs/subjects.toml)
#            landmarks  the cell's characteristic results (Lean names); a blueprint node each
# [[family]] key, title, blurb, hue (a tree colour token), modules (prefixes, longest wins)
# [[joint]]  a theorem whose statement involves two limbs: limbs, node (blueprint label), title
#
# Every module under MathFin/ belongs to exactly one cell (tests/test_taxonomy.py); the files
# directly under MathFin/ (Init, Blueprint, the audits) are the library's own machinery.

meta = ["MathFin.Init", "MathFin.Blueprint", "MathFin.AxiomAudit", "MathFin.AxiomAuditGen"]

# ───────────────────────────── roots ─────────────────────────────

[[cell]]
key = "probability"
kind = "root"
title = "Probability"
blurb = "martingales, stopping, Brownian and jump calculus, Gaussian laws, dependence, convexity"

[[cell]]
key = "probability/discrete"
title = "Discrete time"
blurb = "martingale transforms, Doob decomposition, the Snell envelope, path measures, Markov chains"
modules = ["MathFin.Probability.Discrete"]
subjects = ["MSC 60G42", "MSC 60G40", "MSC 60J10"]

[[cell]]
key = "probability/martingales"
