label = "thm:heston-cf"
title = "Heston characteristic function"
statement = "The Heston characteristic function's C and D solve the Heston Riccati ODEs."
uses = ["thm:heston-pde"]
area = "stoch-vol"

[[node]]
label = "thm:model-free-variance"
title = "Model-free implied variance replication"
statement = "Implied variance (VIX) is the 1/K² strip of out-of-the-money options."
uses = ["thm:carr-madan"]
area = "stoch-vol"

[[node]]
label = "thm:rough-heston-pathwise-uniqueness"
title = "Rough-Heston pathwise uniqueness"
statement = "Pathwise uniqueness holds for the square-root rough-Heston variance equation (open problem)."
uses = ["thm:sde-strong-solution"]
area = "stoch-vol"

[[node]]
label = "thm:sabr-hagan"
title = "SABR Hagan asymptotic implied vol"
statement = "Hagan's asymptotic implied volatility holds at ATM leading order with an O(T²) error bound."
uses = ["thm:bs-call"]
area = "stoch-vol"

[[node]]
label = "thm:schrodinger-spx-vix"
title = "Schrödinger calibration of SPX/VIX"
statement = "Integrable Schrödinger potentials exist for continuum SPX/VIX calibration (open problem)."
uses = ["thm:model-free-variance"]
area = "stoch-vol"

[[node]]
label = "thm:smile-no-arbitrage"
title = "Smile no-arbitrage (Roper, SVI)"
statement = "Static no-arbitrage conditions on an implied-vol smile (Roper, the left wing, calendar spreads) and the raw-SVI slice's convexity and linear wings."
uses = ["thm:carr-madan", "thm:bs-call"]
area = "stoch-vol"

[[node]]
label = "thm:sde-continuous-solution"
title = "Continuous strong solutions on every horizon"
statement = "The every-horizon Picard fixed point has a continuous adapted representative solving dX=b(X)dt+σ(X)dB pathwise, unique up to indistinguishability."
uses = ["thm:sde-strong-solution"]
area = "foundations"

[[node]]
label = "thm:stochastic-fubini-process"
title = "Stochastic Fubini for the integral process"
statement = "The parameter integral and the Itô integral commute as processes in t, almost surely at every t at once."
uses = ["thm:stochastic-fubini"]
core = ["sc-stochastic-fubini-ito"]
area = "foundations"

# ---- the one-trunk hinges (docs/specs/2026-11-07-one-trunk-design.md §5)

[[node]]
label = "thm:bs-arbitrage-free-price"
title = "The Black–Scholes price is the arbitrage-free price"
statement = "In the Black–Scholes market every pricing measure with a square-integrable density gives the European call the price bsCallPrice, which is also the superreplication price and the initial capital of the delta hedge."
uses = ["def:pricing-functional", "thm:bs-call", "thm:physical-measure-pricing", "thm:market-completeness", "thm:bs-self-financing"]
area = "black-scholes"

[[node]]
label = "thm:zero-coupon-bond-price"
title = "The zero-coupon bond price is a price"
statement = "Under a deterministic short rate the conditional price of the unit zero-coupon claim is zcb, so the flat-rate duration, convexity and key-rate results are statements about a price."
uses = ["def:pricing-functional", "def:zero-coupon-bond"]
area = "fixed-income"

[[node]]
label = "thm:jump-diffusion-price"
title = "Jump-diffusion prices under the Esscher pricing measure"
statement = "The Merton jump-diffusion market has a pricing measure (the Esscher one), and under it the European call's price is the Poisson mixture of Black–Scholes prices."
uses = ["def:pricing-functional", "thm:esscher-emm-levy", "thm:jump-diffusion-mixing", "thm:merton-risk-neutral-drift"]
area = "black-scholes"

[[node]]
label = "thm:expected-shortfall-dual-set"
title = "Expected shortfall's representing set"
statement = "On a finite space the representing set of expected shortfall in the ADEH representation is exactly the probability densities bounded by 1/(1−α), joining coherentRisk_isLUB to the general-space dual."
uses = ["thm:expected-shortfall-coherent", "def:expected-shortfall", "def:coherent-risk-measure"]
area = "risk"

[[node]]
label = "thm:superhedging-coherent"
title = "The superhedging price is a coherent risk measure"
statement = "On a finite space the superreplication price of a loss is a coherent risk measure, bounded below by its price under every pricing measure, with equality to the supremum once finitely generated cones are closed."
uses = ["def:pricing-functional", "def:coherent-risk-measure"]
area = "risk"

[[node]]
label = "thm:utility-state-price-density"
title = "Marginal utility is a state-price density"
statement = "At the optimum of a finite-state expected-utility problem with a budget constraint, marginal utility of optimal wealth is proportional to a state-price density, so the optimum defines a pricing measure; Kelly is the logarithmic case."
uses = ["def:pricing-functional", "def:kelly-fraction"]
area = "portfolio"

[[node]]
label = "thm:sdf-capm-hansen-jagannathan"
title = "CAPM and Hansen–Jagannathan from the discount factor"
statement = "A stochastic discount factor affine in the market return yields the CAPM security market line, and Cauchy–Schwarz on state prices bounds every Sharpe ratio by σ(m)/E[m]."
uses = ["thm:utility-state-price-density", "thm:capm-equilibrium", "def:sharpe-ratio"]
area = "portfolio"

[[node]]
label = "thm:premium-is-price"
title = "Insurance premiums are prices"
statement = "The net premium of a survival-contingent benefit is its contract value under a deterministic discount and the survival law, and the Esscher premium is the price under the Esscher-tilted measure."
uses = ["def:pricing-functional", "def:survival-function", "thm:esscher-tilt"]
area = "actuarial"

[[node]]
label = "thm:glosten-milgrom-pricing-measure"
title = "The Glosten–Milgrom quote process is a martingale"
statement = "In the Glosten–Milgrom model the sequence of quotes is a martingale for the dealer's information, so the dealer's measure prices the asset."
uses = ["thm:glosten-milgrom-quote", "def:pricing-functional"]
area = "execution"

[[node]]
label = "thm:lp-position-price"
title = "An AMM liquidity position is a contract"
statement = "A constant-product or concentrated-liquidity position is a Contract whose price under a lognormal pricing measure is the existing closed-form integral."
uses = ["def:pricing-functional", "thm:uniswap-v3-covered-call"]
area = "defi"

[[node]]
label = "thm:cva-is-price"
title = "CVA is the price of the default loss"
statement = "Unilateral CVA is the price of the default-contingent exposure loss as a contract under a pricing measure with an independent default time, and the Gaussian-exposure closed form is a theorem about it."
uses = ["def:pricing-functional", "thm:unilateral-cva"]
area = "credit"
