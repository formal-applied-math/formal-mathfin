[[node]]
label = "thm:kusuoka"
title = "Kusuoka representation"
statement = "Law-invariant coherent risk measures are suprema of CVaR mixtures."
uses = ["thm:expected-shortfall-coherent", "def:coherent-risk-measure"]
area = "risk/measures"

[[node]]
label = "thm:quantile-convergence-in-distribution"
title = "Quantiles under convergence in distribution"
statement = "If X_n → X in distribution then the quantiles converge at every continuity point of X's quantile function (Portmanteau), so the ASRF VaR limit holds in distribution."
uses = ["def:quantile"]
core = ["qrm-quantile-convergence"]
area = "statistics"

[[node]]
label = "thm:risk-measure-families"
title = "Entropic, distortion and expectile risk measures"
statement = "Entropic, Wang-distortion and expectile risk measures satisfy their axioms (convexity, cash invariance, coherence for τ≥½)."
uses = ["def:coherent-risk-measure"]
area = "risk/measures"

[[node]]
label = "thm:sklar-general"
title = "Sklar's theorem for arbitrary margins"
statement = "Every joint distribution function factors as C(F₁,…,F_d) through a copula C, without assuming continuous margins (the library has the continuous case)."
uses = ["def:quantile"]
area = "probability/dependence"

[[node]]
label = "thm:bates-cf"
title = "Bates characteristic function"
statement = "The Bates stochastic-volatility-plus-jumps characteristic function."
uses = ["thm:heston-cf", "thm:jump-diffusion-law"]
area = "valuation/volatility"
family = "volatility"

[[node]]
label = "thm:cev-call"
title = "CEV European call"
statement = "The CEV call price in closed form via the non-central chi-squared law."
uses = ["thm:bs-call"]
area = "valuation/volatility"
family = "volatility"

[[node]]
label = "thm:dupire-local-vol"
title = "Dupire local volatility"
statement = "The local volatility is determined by call prices via σ²=(∂_T C+rK∂_K C)/(½K²∂²_K C)."
uses = ["thm:bs-pde", "thm:feynman-kac-variable-coefficient", "thm:dupire-zero-rates"]
core = ["mf-dupire-local-vol"]
area = "valuation/volatility"
family = "volatility"

[[node]]
label = "thm:heston-cf"
title = "Heston characteristic function"
statement = "The Heston characteristic function's C and D solve the Heston Riccati ODEs."
uses = ["thm:heston-pde"]
area = "valuation/volatility"
family = "volatility"

[[node]]
label = "thm:model-free-variance"
title = "Model-free implied variance replication"
statement = "Implied variance (VIX) is the 1/K² strip of out-of-the-money options."
uses = ["thm:carr-madan"]
area = "valuation/model-free"
family = "model-free"

[[node]]
label = "thm:rough-heston-pathwise-uniqueness"
title = "Rough-Heston pathwise uniqueness"
statement = "Pathwise uniqueness holds for the square-root rough-Heston variance equation (open problem)."
uses = ["thm:sde-strong-solution"]
area = "valuation/volatility"
family = "volatility"

[[node]]
label = "thm:sabr-hagan"
title = "SABR Hagan asymptotic implied vol"
statement = "Hagan's asymptotic implied volatility holds at ATM leading order with an O(T²) error bound."
uses = ["thm:bs-call"]
area = "valuation/volatility"
family = "volatility"

[[node]]
label = "thm:schrodinger-spx-vix"
title = "Schrödinger calibration of SPX/VIX"
statement = "Integrable Schrödinger potentials exist for continuum SPX/VIX calibration (open problem)."
uses = ["thm:model-free-variance"]
area = "valuation/volatility"
family = "volatility"

[[node]]
label = "thm:smile-no-arbitrage"
title = "Smile no-arbitrage (Roper, SVI)"
statement = "Roper's converse: every normalised call price function (convex, nonincreasing, between the intrinsic value and one, with limits one and zero) is the call price function, at maturity one, of a market with unit numéraire, a positive asset of forward one and a pricing measure. Raw SVI slices and the left wing, calendar spreads are further instances not stated here."
uses = ["thm:carr-madan", "thm:bs-call"]
area = "valuation/volatility"
family = "volatility"
lean = "MathFinFrontier.exists_market_of_isNormalizedCallPrice"

[[node]]
label = "thm:sde-continuous-solution"
title = "Continuous strong solutions on every horizon"
statement = "The every-horizon Picard fixed point has a continuous adapted representative solving dX=b(X)dt+σ(X)dB pathwise, unique up to indistinguishability."
uses = ["thm:sde-strong-solution"]
area = "probability/brownian"

[[node]]
label = "thm:stochastic-fubini-process"
title = "Stochastic Fubini for the integral process"
statement = "The parameter integral and the Itô integral commute as processes in t, almost surely at every t at once."
uses = ["thm:stochastic-fubini"]
core = ["sc-stochastic-fubini-ito"]
area = "probability/brownian"

# ---- the one-trunk hinges (docs/specs/2026-11-07-one-trunk-design.md §5)

[[node]]
label = "thm:bs-arbitrage-free-price"
title = "The Black–Scholes price is the arbitrage-free price"
statement = "In the Black–Scholes market every pricing measure with a square-integrable density gives the European call the price bsCallPrice, which is also the superreplication price and the initial capital of the delta hedge."
uses = ["def:pricing-functional", "thm:bs-call", "thm:physical-measure-pricing", "thm:market-completeness", "thm:bs-delta-hedge"]
area = "valuation/diffusions"
family = "diffusions"

[[node]]
label = "thm:zero-coupon-bond-price"
title = "The zero-coupon bond price is a price"
statement = "The flat-rate value of a zero-coupon portfolio, and the annually compounded price of a coupon bond, are the market price of the corresponding schedule of fixed cash flows when the numéraire is the money market at that rate, so the immunization and key-rate duration results are statements about a price."
uses = ["def:pricing-measure", "thm:bond-immunization", "thm:key-rate-duration"]
area = "valuation/term"
family = "term"
lean = "MathFinFrontier.bondPortfolioValue_eq_price"

[[node]]
label = "thm:jump-diffusion-price"
title = "Jump-diffusion prices under the Esscher pricing measure"
statement = "The Merton jump-diffusion market has a pricing measure (the Esscher one), and under it the European call's price is the Poisson mixture of Black–Scholes prices."
uses = ["def:pricing-functional", "thm:esscher-emm-levy", "thm:jump-diffusion-mixing", "thm:merton-risk-neutral-drift"]
area = "valuation/jumps"
family = "jumps"

[[node]]
label = "thm:utility-state-price-density"
title = "Marginal utility is a state-price density"
statement = "At the optimum of a finite-state expected-utility problem with a budget constraint, marginal utility of optimal wealth is proportional to a state-price density, so the optimum defines a pricing measure; Kelly is the logarithmic case."
uses = ["def:pricing-functional", "thm:kelly-criterion"]
area = "choice/preferences"

[[node]]
label = "thm:sdf-capm-hansen-jagannathan"
title = "CAPM and Hansen–Jagannathan from the discount factor"
statement = "A stochastic discount factor affine in the market return yields the CAPM security market line, and Cauchy–Schwarz on state prices bounds every Sharpe ratio by σ(m)/E[m]."
uses = ["thm:utility-state-price-density", "thm:capm-equilibrium", "def:sharpe-ratio"]
area = "choice/equilibrium"

[[node]]
label = "thm:premium-is-price"
title = "Insurance premiums are prices"
statement = "The life annuity-due for a force of mortality is the value, on the flat-rate discount, of the contract paying one at each date while the default indicator of the lifetime is still zero."
uses = ["def:contract-value", "def:survival-function"]
area = "valuation/insurance"
family = "insurance"
lean = "MathFinFrontier.lifeAnnuityDue_eq_value"

[[node]]
label = "thm:glosten-milgrom-pricing-measure"
title = "The Glosten–Milgrom quote process is a martingale"
statement = "The Glosten–Milgrom dealer's quote after n trades is the conditional expectation of the value given the observed history of trade directions, which extends the one-trade identification to a sequence; with the proved fact that a conditional-expectation process is priced by its own measure (thm:conditional-expectation-pricing-measure) the quote sequence is a martingale for the dealer's measure."
uses = ["thm:glosten-milgrom-quote", "thm:conditional-expectation-pricing-measure"]
area = "choice/trading"
family = "mechanisms"
lean = "MathFinFrontier.condExp_payoff_eq_quote_history"

[[node]]
label = "thm:lp-position-price"
title = "An AMM liquidity position is a contract"
statement = "A constant-product or concentrated-liquidity position is a Contract (a payoff in the square root of the price): in any market its price is the discounted expectation of the position value of UniswapMechanics. Its closed form in Φ under the Black–Scholes market is not stated."
uses = ["def:pricing-measure", "thm:uniswap-v3-covered-call", "thm:impermanent-loss"]
area = "valuation/mechanisms"
family = "mechanisms"
lean = "MathFinFrontier.price_lpPayoff"

[[node]]
label = "thm:cva-is-price"
title = "CVA is the price of the default loss"
statement = "Unilateral CVA is the price of the default-contingent exposure loss as a contract under a pricing measure with an independent default time, and the Gaussian-exposure closed form is a theorem about it."
uses = ["def:pricing-functional", "thm:unilateral-cva"]
area = "valuation/default"
family = "default"

[[node]]
label = "thm:von-neumann-morgenstern"
title = "von Neumann–Morgenstern representation theorem"
statement = """A preference on finite lotteries that is complete, transitive, continuous and \
satisfies independence is represented by expected utility: there is a utility u, unique up to a \
positive affine map, with p ⪰ q iff E_p[u] ≥ E_q[u]. The library proves the converse, that \
expected-utility preferences satisfy the axioms (thm:expected-utility-axioms)."""
uses = ["thm:expected-utility-axioms", "def:expected-utility"]
area = "choice/preferences"

[[node]]
label = "thm:delbaen-representation"
title = "Delbaen's representation of coherent risk measures"
statement = """A coherent risk measure on L^∞(Ω, P) with the Fatou property is the supremum of \
E_Q[X] over a set of probability measures Q ≪ P (Delbaen 2002). The library proves the finite \
state space case (thm:coherent-risk-representation) and the dual form of expected shortfall \
on any probability space."""
uses = ["thm:coherent-risk-representation", "thm:expected-shortfall-dual"]
area = "risk/measures"

[[node]]
label = "thm:market-call-price-normalized"
title = "A pricing measure gives a normalised call price function"
statement = "In a market with unit numéraire and a positive asset, priced at T by a pricing measure, the calls at the strikes kF, in units of the forward F, are a normalised call price function."
uses = ["def:pricing-measure", "thm:smile-no-arbitrage"]
area = "valuation/volatility"
family = "volatility"
lean = "MathFinFrontier.isNormalizedCallPrice_of_isPricingMeasure"

[[node]]
label = "thm:svi-market-realisation"
title = "A butterfly-free SVI slice is a market"
statement = "If the raw SVI parameters satisfy the butterfly-free sign formula, the SVI-smiled Black call is the call price function at maturity one of a market with unit numéraire, forward one and a pricing measure."
uses = ["thm:smile-no-arbitrage", "def:pricing-measure"]
area = "valuation/volatility"
family = "volatility"
lean = "MathFinFrontier.svi_realised_by_market"

[[node]]
label = "thm:credit-portfolio-is-merton"
title = "The one-factor credit portfolio is Merton's"
statement = "With the standardised log firm value equal to the root of rho times a systematic normal plus the root of one minus rho times an independent normal, a Merton name defaults at T, given the systematic factor, with probability oneFactorPD of its Merton default probability kmvPD."
uses = ["def:gaussian-factor-copula", "thm:large-pool-loss"]
area = "risk/credit"
family = "default"
lean = "MathFinFrontier.condDefault_eq_oneFactorPD"

[[node]]
label = "thm:tranche-leg-price"
title = "A CDO tranche leg is a contract"
statement = "The tranche leg, the tranche loss paid at T as a Contract on the portfolio loss fraction, is worth on a deterministic discount curve the discounted expected tranchePayoff."
uses = ["def:contract-value", "thm:large-pool-loss"]
area = "risk/credit"
family = "default"
lean = "MathFinFrontier.value_trancheLeg"

[[node]]
label = "thm:esscher-premium-is-price"
title = "The Esscher premium is a price"
statement = "With unit numéraire and the insured loss as the asset at T, the claim paying the loss is worth, under the Esscher-tilted measure, the Esscher premium E[X e^{hX}]/E[e^{hX}]."
uses = ["def:pricing-measure", "thm:esscher-tilt"]
area = "valuation/insurance"
family = "insurance"
lean = "MathFinFrontier.esscherPremium_eq_price"

[[node]]
label = "thm:american-price-snell-envelope"
title = "The binomial American price is the Snell envelope of the market"
statement = "Under the risk-neutral coin flips, the binomial americanPrice is the Snell envelope, for Mathlib's conditional expectation on the flip filtration, of the discounted intrinsic value along the spot path, at time zero."
uses = ["thm:snell-envelope", "def:pricing-measure"]
area = "valuation/trees"
family = "trees"
lean = "MathFinFrontier.americanPrice_eq_snellEnvelope"

[[node]]
label = "thm:american-put-dominates-european"
title = "The American put value dominates the Black–Scholes European price"
statement = "At the Girsanov pricing measure of the Black–Scholes market, the price of the European put is at most the American put value over stopping rules bounded by the maturity."
uses = ["def:pricing-measure", "thm:american-put-optimal-exercise", "thm:bs-call"]
area = "valuation/diffusions"
family = "diffusions"
lean = "MathFinFrontier.price_europeanPut_le_americanPutValue"

[[node]]
label = "thm:american-put-superhedging-price"
title = "The American put value is the superhedging price"
statement = "In the complete Black–Scholes market the American put value (the supremum of discounted expected payoffs over stopping rules) equals the superreplication price of the American put, that is, the least initial capital of a self-financing strategy dominating the put payoff at every date. Needs the superreplication price of a path-dependent claim in Market, which is not defined yet."
uses = ["thm:american-put-dominates-european", "thm:market-completeness"]
area = "valuation/diffusions"
family = "diffusions"
