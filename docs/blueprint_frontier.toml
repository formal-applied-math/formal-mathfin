# The blueprint's frontier: results on the program, stated, not yet formalized.
#
# A node here has no Lean declaration yet, so it cannot be an `@[blueprint]` tag (the
# library is sorry-free). It is linked to its issues by the issues themselves: each one
# carries a body line `Blueprint: <label>`. `python3 -m tools.verify.blueprint_issues check`
# keeps both sides connected (every frontier node has an open issue; every open math issue
# names a node). When the result is delivered, tag the declaration in
# `MathFin/Blueprint.lean` with the same label and delete the entry here.
#
# Fields: label (`thm:`/`def:` + kebab-case), title, statement (one honest sentence of what
# proving it would establish), uses (labels it builds on), area (a cell key of docs/taxonomy.toml).
# Optional `family` (a family key of the same file) names the randomness it is about.
#
# Every frontier node grows from the proved blueprint: following `uses` (through other frontier
# nodes) reaches a node with a Lean declaration. A result that builds only on Mathlib says so in
# `ground` instead ("Mathlib: …", what it draws on). `blueprint_issues check` enforces this.
#
# Optional `lean` makes the node a **connector**: the full name of a theorem in `MathFinFrontier/`
# that states it as Lean, closed by `sorry` (docs/specs/2026-11-08-chain-design.md §3.5). The
# statement elaborates against the library, so both ends of the link are real declarations;
# `blueprint_issues check` keeps the theorems and the nodes one to one.
#
# Optional `core` lists the corpus entries that already prove part of the node: the node stays on
# the frontier, and the map draws it as partly grown. Each entry must exist; the check flags a
# `core` entry that is not `full` or `reduced_core`.

