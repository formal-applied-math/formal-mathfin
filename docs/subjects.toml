# The subject codes a module's `## Tags` may carry (docs/specs/2026-11-05-library-practices-design.md §4).
#
# A controlled vocabulary: `tools/verify/doc_standard.py` rejects a code not listed here, and the
# HF dataset exports each entry's subjects with these names. Adding a code is adding a row, with
# its official name: JEL from the AEA's Journal of Economic Literature classification, MSC from
# MSC2020.

