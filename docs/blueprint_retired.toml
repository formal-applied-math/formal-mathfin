# Labels the blueprint no longer carries as nodes, and the node each was folded into.
#
# The blueprint is a map of the field's landmarks (docs/specs/2026-11-08-organization-design.md,
# section 5): a waypoint, that is a proof step, a hypothesis bundle, a special case of a landmark
# that is already a node, or a bridge between two encodings, is not a node. When a tag is removed
# from MathFin/Blueprint.lean its label is recorded here, so that issues and pull requests that
# named it stay valid:
#
#   - a CLOSED issue or pull request naming a retired label is history, and fine;
#   - an OPEN one is a problem (`python3 -m tools.verify.blueprint_issues check`): it should name
#     `folded_into` instead;
#   - a retired label is never also a live node, and `folded_into` is a live node or a frontier
#     label.
#
