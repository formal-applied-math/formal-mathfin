slug = "rio-2026"
title = "Formally verified option pricing: a Lean 4 library of mathematical finance"
event = "Research in Options 2026, FGV EMAp, Rio de Janeiro, 3 December 2026"
intro = """formal-mathfin is an open-source library of mathematical finance in Lean 4, built on \
Mathlib and on Rémy Degenne's formalization of Brownian motion. A theorem enters only when every \
hypothesis is stated and every step is checked by Lean's kernel. This page collects what the talk \
showed: the option-pricing results with their exact Lean statements and what each leaves out, \
the open problems the library catalogues, and where to start. Nothing needs installing to read \
any of it."""
landmarks = [
  "MathFin.binomialPrice_call_tendsto_bs_closed",
  "MathFin.Contracts.value_europeanCall_sub_put_of_martingale",
  "MathFin.Contracts.Payoff.IsPiecewiseLinear.pathPV_staticHedge",
  "MathFin.Contracts.BlackScholes.europeanCall_hedge_in_stock_eq_delta",
  "MathFin.SVI.extendedCertificateFormula_iff_bsSmile_convex",
  "MathFin.calendar_free_iff",
  "MathFin.Dupire.dupire_weak",
  "MathFin.BlackScholes.AmericanPut.Stopping.brownianUsualStockBoundary_strictConvexOn",
  "MathFin.JumpDiffusionProcess.martingale_iff",
  "MathFin.ftap_discrete",
  "MathFin.Btheta_isFilteredPreBrownian_predictable_of_bdd",
]
problems = [
  "MF-OP-006", "MF-OP-007",
  "MF-OP-004", "MF-OP-005", "MF-OP-009", "MF-OP-001", "MF-OP-010", "MF-OP-015",
  "MF-OP-013", "MF-OP-018",
]

