name: Downside candidate check

on:
  push:
    branches: [codex/issue-73-downside-metrics]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: lake build + benchmark ledger
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python gates
        run: |
          pip install --quiet pytest

      - name: Build (elan + Mathlib cache + lake build)
        uses: leanprover/lean-action@v1

      - name: Verify the missing downside benchmark and update ledger
        run: |
          python3 -m tools.verify.ledger verify --stale --limit 1 --exec --timeout 1800
          python3 -m tools.verify.ledger status

      - name: Final Python gates
        run: |
          python3 -m pytest tests/ -q
          python3 -m tools.formalization_yaml --check

      - name: Upload verified ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downside-verified-ledger
          path: verification_ledger.json
          retention-days: 1
