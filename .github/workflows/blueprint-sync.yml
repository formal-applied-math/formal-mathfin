name: blueprint-sync

# The blueprint and the issue tracker stay connected (tools/verify/blueprint_issues.py).
# The link lives in each issue's body (`Blueprint: <node label>`), so it can break without
# a push: an issue opened without a node, a node's last open issue closed. This workflow
# checks on every issue event and nightly; build.yml checks on every push. On an issue
# event the bot leaves one comment on that issue naming what is missing, and edits the
# same comment once it is fixed. It also writes the issue's area:/family: labels, derived from
# the nodes it names and docs/taxonomy.toml; nobody sets those by hand.

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: blueprint-sync-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: This issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m tools.verify.blueprint_issues labels ${{ github.event.issue.number }} --apply
          python3 -m tools.verify.blueprint_issues comment ${{ github.event.issue.number }}

      - name: Whole program
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m tools.verify.blueprint_issues labels --apply
          python3 -m tools.verify.blueprint_issues check | tee -a "$GITHUB_STEP_SUMMARY"
