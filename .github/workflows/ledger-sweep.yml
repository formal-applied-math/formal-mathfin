name: ledger sweep

# CORPUS-SCALE RE-VERIFICATION, on a runner — the sweep the memory doctrine
# says belongs here rather than on the 10 GB box (CLAUDE.md, "Full-environment
# batch work runs on GitHub runners").
#
# Why it has to exist: a substantive pin bump moves the pin segment of every
# entry's input hash, so all ~341 benchmark entries restale at once, and
# `ledger rebase-pins` is explicitly NOT a shortcut for that case ("never as a
# shortcut after substantive pin bumps — those won't match the proof gate
# anyway, by design"). The only honest way back to a fresh ledger is to
# re-verify, and re-verifying the corpus serially is 4-6 hours of Lean.
#
# Shape: `verify --exec` re-checks each snippet with a stateless
# `lake env lean` (~30-90 s each, immune to the daemon's cold-start
# pathology). Twelve shards, dealt round-robin off the import-set ordering so
# no shard inherits all the cold import sets, bring that to ~30 min of
# wall-clock (fewer shards when fewer entries are stale: the preflight sizes the matrix). Each shard writes only the rows it verified (`--fragment`); a
# final job folds them together (`merge-fragments`) and commits the refreshed
# ledger back to the branch, because a ledger nobody committed proves nothing.
#
# Triggering: pin-file PRs (a bump is exactly when the whole corpus restales)
# plus manual dispatch. It is deliberately NOT on every PR — an ordinary proof
# change restales a handful of entries, which the local daemon path handles in
# minutes. When that path is unavailable (the one local Lean slot is taken), a
# manual dispatch with `scope: stale` re-verifies just those entries here;
# `scope: all` (the default, and what pin-file PRs get) re-verifies everything.
#
# Loop safety: the merge job pushes a commit to the PR branch, which re-triggers
# this workflow (the PR's diff still touches the pin files). That second run
# finds the ledger already fresh, the preflight short-circuits it, and no
# further commit is made. The recursion terminates after exactly one extra
# no-op run.

on:
  pull_request:
    paths:
      - 'lean-toolchain'
      - 'lakefile.lean'
      - 'lake-manifest.json'
  workflow_dispatch:
    inputs:
      scope:
        description: "all = re-verify every entry (a pin bump); stale = only entries whose inputs changed"
        type: choice
        options: [all, stale]
        default: all

concurrency:
  group: ledger-sweep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Cheap stdlib-only gate: if nothing is stale there is no sweep to run, and
  # this is also what stops the push-retrigger recursion.
  preflight:
    name: is anything stale?
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
      shards: ${{ steps.check.outputs.shards }}
      count: ${{ steps.check.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      # Every shard pays a full `lake build` before it verifies anything, so the shard count
      # follows the work: about 15 entries a shard, at most 12. Re-verifying two entries is one
      # runner, not twelve.
      - id: check
        env:
          SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          if python3 -m tools.verify.ledger status > status.txt; then
            echo "ledger is already fresh — nothing to sweep"
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -m tools.verify.ledger status > status.txt || true
          head -1 status.txt
          n=$(python3 - "$SCOPE" <<'PY'
          import re, sys
          f, s, m = map(int, re.findall(r"\d+", open("status.txt").readline())[:3])
          print(f + s + m if sys.argv[1] == "all" else s + m)
          PY
          )
          k=$(( (n + 14) / 15 )); [ "$k" -lt 1 ] && k=1; [ "$k" -gt 12 ] && k=12
          echo "$n entries to verify on $k shard(s)"
          echo "stale=true" >> "$GITHUB_OUTPUT"
          echo "count=$k" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range(1, $k + 1))))")" >> "$GITHUB_OUTPUT"

  verify:
    name: shard ${{ matrix.shard }}/${{ needs.preflight.outputs.count }}
    needs: preflight
    if: needs.preflight.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.preflight.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      # The Mathlib cache download flakes ("download failed", "Broken pipe") often enough
      # that one bad mirror read used to fail the job. `lake exe cache get` only fetches
      # what is missing, so retrying it is cheap; lean-action then skips its own fetch.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Mathlib cache (retried)
        run: |
          for i in 1 2 3 4; do
            lake exe cache get && exit 0
            echo "cache get failed (attempt $i), retrying in $((i * 20)) s"
            sleep $((i * 20))
          done
          exit 1

      # Build the library once per shard so `lake env lean` has oleans to
      # elaborate against. `lint: false` for the same reason as pin-bump.yml:
      # the env-linter suite is advisory here and must not fail a sweep.
      - name: Build (elan + Mathlib cache + lake build)
        uses: leanprover/lean-action@v1
        with:
          lint: "false"
          use-mathlib-cache: "false"

      # LEDGER_EXEC_LOCAL: run `lake env lean` in THIS environment rather than
      # `docker exec`-ing into the local daemon container.
      - name: Verify this shard
        env:
          LEDGER_EXEC_LOCAL: "1"
          SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          python3 -m tools.verify.ledger verify "--${SCOPE}" --exec \
            --shard "${{ matrix.shard }}/${{ needs.preflight.outputs.count }}" \
            --fragment "fragment-${{ matrix.shard }}.json" \
            --timeout 600

      # Uploaded even on failure: a shard that verified 25 of its 29 entries
      # still moves the ledger forward, and throwing that away would mean
      # re-running an hour of Lean to recover it.
      - name: Upload the rows this shard verified
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-fragment-${{ matrix.shard }}
          path: fragment-${{ matrix.shard }}.json
          if-no-files-found: warn

  merge:
    name: merge fragments + commit the refreshed ledger
    needs: verify
    if: always() && needs.verify.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: ledger-fragment-*
          path: fragments
          merge-multiple: true

      - name: Fold the fragments into verification_ledger.json
        run: |
          shopt -s nullglob
          files=(fragments/fragment-*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no fragments — nothing verified"; exit 1
          fi
          python3 -m tools.verify.ledger merge-fragments "${files[@]}"

      - name: Report the resulting freshness
        id: status
        run: |
          python3 -m tools.verify.ledger status | head -1
          python3 -m tools.verify.ledger status > /dev/null \
            && echo "fresh=true" >> "$GITHUB_OUTPUT" \
            || echo "fresh=false" >> "$GITHUB_OUTPUT"

      - name: Commit
        env:
          SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          if git diff --quiet -- verification_ledger.json; then
            echo "ledger unchanged — nothing to commit"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification_ledger.json
          if [ "$SCOPE" = stale ]; then
            git commit \
              -m "chore(ledger): re-verify the entries whose inputs changed" \
              -m "Sharded 'ledger verify --stale --exec' on runners (ledger-sweep.yml, scope: stale). Every row here is a snippet re-elaborated against its changed inputs, not a rehash."
          else
            git commit \
              -m "chore(ledger): re-verify the corpus at the new pin" \
              -m "Sharded 'ledger verify --all --exec' sweep on runners (ledger-sweep.yml). Every row here is a snippet re-elaborated against the new pin, not a rehash — 'rebase-pins' is not valid after a substantive pin bump."
          fi
          git push

      # The sweep is only "done" if the ledger is actually fresh afterwards.
      # A shard that failed entries leaves them stale, and that must be loud.
      - name: Fail if entries remain stale
        if: steps.status.outputs.fresh != 'true'
        run: |
          echo "::error::sweep incomplete — entries are still stale (see the shard logs for FAILs)"
          python3 -m tools.verify.ledger status | head -40
          exit 1
