name: comparator

# Judge every Palomar entry's Solution against its Challenge with Lean's own comparator (`lake comparator`, in
# core since v4.35.0; it replaces the standalone leanprover/comparator). Comparator checks that
# each theorem named in an entry's comparator config (`comparator.json` at the root for ADEH,
# `Palomar/<Entry>/comparator.json` for the rest) proves the same statement as the Mathlib-only
# Challenge, uses no axiom outside `propext`, `Quot.sound`, `Classical.choice`, and is accepted
# by the kernel. `--paranoid` also runs every external checker bundled with Lean
# (leanchecker-paranoid, lean4lean, nanoda, con-leche, con-ron), so the verdict needs every one
# of them, not only Lean's kernel. The project is built and exported inside a `bwrap` sandbox.
#
# The cátedra's open problems use the same check (docs/specs/2026-11-20-catedra-design.md):
# `comparator/<MF-OP-id>.json` names the pinned statement as the challenge (in `MathFinFrontier/`
# while open, in `Catedra/<ID>/Challenge.lean` once solved) and `Catedra/<ID>/Solution.lean` as the
# solution. A problem with no solution yet is listed and skipped.
#
# Runs on pull requests and pushes to main that change an entry or the library its Solutions use,
# monthly, and on demand. docs/palomar.md lists the entries and their registry submissions.

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 1 * *"   # the 1st of each month, 05:47 UTC
  push:
    branches: [main]
    paths:
      - Challenge.lean
      - Solution.lean
      - comparator.json
      - comparator/**
      - Catedra/**
      - MathFinFrontier/**
      - Palomar/**
      - MathFin/**
      - lean-toolchain
      - lake-manifest.json
  pull_request:
    paths:
      - Challenge.lean
      - Solution.lean
      - comparator.json
      - comparator/**
      - Catedra/**
      - MathFinFrontier/**
      - Palomar/**
      - MathFin/**
      - lean-toolchain
      - lake-manifest.json
      - .github/workflows/comparator.yml

concurrency:
  group: comparator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Sandbox (bubblewrap, unprivileged user namespaces)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Lean + Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: "false"
          lint: "false"
          use-mathlib-cache: "true"

      - name: Judge each Solution against its Challenge (all bundled kernels)
        run: |
          status=0
          for config in comparator.json Palomar/*/comparator.json; do
            echo "::group::$config"
            lake comparator --config "$config" --paranoid || { echo "::error::$config failed"; status=1; }
            echo "::endgroup::"
          done
          for config in comparator/*.json; do
            solution=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['solution_module'].replace('.', '/') + '.lean')" "$config")
            if [ ! -f "$solution" ]; then echo "$config: no solution yet ($solution)"; continue; fi
            echo "::group::$config"
            lake comparator --config "$config" --paranoid || { echo "::error::$config failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status
