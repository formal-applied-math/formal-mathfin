name: kernel-replay

# Defense in depth below the elaborator: replay every MathFin content module's declarations
# through the Lean kernel with the toolchain's `leanchecker`, so an elaborator bug or an
# environment hack cannot slip past. The enforced floor stays build.yml (a green `lake build`
# and AxiomAudit's `#guard_msgs`-pinned axioms); this is the layer under it.
#
# History. From 2026-06-07 the replay could not finish on a 16 GB hosted runner: every module
# imported Mathlib whole, so each `leanchecker` loaded the full environment (~14 GB) and was
# OOM-killed inside the first batch at any cgroup cap. Once the library's imports were narrowed
# (docs/specs/2026-11-05-library-practices-design.md §6c, `whole_mathlib_imports` 0), the
# 2026-11-07 run on main replayed 62 batches of 8 modules at about a minute each with at least
# 5.6 GB free throughout, and stopped only at the 60-minute limit. The library is therefore
# split into shards that run in parallel, each well inside its limit.
#
# Each shard takes every SHARDS-th module (`NR % SHARDS`), so the slow and fast parts of the
# library spread evenly. Within a shard, a fresh `leanchecker` per batch of 8 releases memory
# between batches and keeps import loading amortised inside one. The cgroup cap stays as
# containment: a module whose closure grows past it is killed alone, not the runner agent.
#
# Excluded: modules that re-export the whole library and declare no proof content (`Examples`,
# `AxiomAudit*`, `Blueprint`). Every theorem they mention is replayed in its declaring module.
#
# Runs monthly and on demand, on GitHub runners by the memory doctrine (CLAUDE.md).

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 1 * *"   # the 1st of each month, 05:17 UTC

concurrency:
  group: kernel-replay
  cancel-in-progress: true

jobs:
  kernel-replay:
    name: leanchecker kernel replay (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    env:
      SHARDS: 6
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same cache key family as build.yml (manifest-keyed): on a hit the inner `lake build`
      # is an incremental no-op and leanchecker only pays import loads.
      - name: Build / restore (elan + Mathlib cache + lake build)
        uses: leanprover/lean-action@v1

      - name: Replay this shard's modules through the kernel
        run: |
          echo "== runner resources =="; free -h; df -h /
          sudo mkdir -p /sys/fs/cgroup/leancheck
          echo $$ | sudo tee /sys/fs/cgroup/leancheck/cgroup.procs > /dev/null
          echo 12G | sudo tee /sys/fs/cgroup/leancheck/memory.high  > /dev/null
          echo 13G | sudo tee /sys/fs/cgroup/leancheck/memory.max   > /dev/null
          ( while true; do free -m | awk '/^Mem/{print strftime("%T"), "avail:", $7, "MB"}'; sleep 15; done ) &
          TICKER=$!
          find MathFin -name '*.lean' | sort | sed 's|/|.|g; s|\.lean$||' \
            | grep -v -E '^MathFin\.(Examples|AxiomAudit|Blueprint)' \
            | awk -v n="$SHARDS" -v k="$SHARD" 'NR % n == k' > /tmp/modules.txt
          total=$(wc -l < /tmp/modules.txt)
          echo "shard $SHARD/$SHARDS: checking $total modules in batches of 8"
          batch=0
          while mapfile -t -n 8 chunk && ((${#chunk[@]})); do
            batch=$((batch+1))
            echo "::group::batch $batch (${chunk[0]} …)"
            t0=$(date +%s)
            lake env leanchecker "${chunk[@]}"
            echo "batch $batch ok in $(( $(date +%s) - t0 ))s"
            echo "::endgroup::"
          done < /tmp/modules.txt
          kill "$TICKER" 2>/dev/null || true
          echo "shard $SHARD: $total modules replayed"
