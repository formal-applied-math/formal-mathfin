version: v0.4
project:
  name: formal-mathfin
  description: "A Lean 4 library of formally verified mathematical finance, built on Mathlib and Rémy Degenne's BrownianMotion package. The declarations registered from this repository are the Artzner–Delbaen–Eber–Heath representation theorem for coherent risk measures on a finite state space — a coherent risk measure is the least upper bound of expected loss over its representing set of probability vectors, obtained by separating a rejected position from the acceptance cone — together with the coherence of worst-case loss, which witnesses on a nonempty state space that the representation theorem's hypothesis is satisfiable. They sit in a wider corpus covering continuous-time stochastic processes and mathematical finance: the Itô integral and Itô formula, Girsanov's theorem and the equivalent martingale measure, martingale representation and market completeness, SDE existence and uniqueness, the fundamental theorem of asset pricing, and Black–Scholes pricing and its exotics."
  authors:
    - Raphael Coelho
  license: Apache-2.0
  responsible_maintainers:
    - Raphael Coelho
